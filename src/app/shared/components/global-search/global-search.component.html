<mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
  <mat-icon matPrefix>search</mat-icon>
  <input
    #searchInput
    matInput
    type="text"
    placeholder="Search products, customers, invoices…  (Ctrl+K)"
    [formControl]="control"
    [matAutocomplete]="auto"
    autocomplete="off"
  />
  <mat-autocomplete #auto [displayWith]="displayFn" (optionSelected)="go($event.option.value)">
    @for (result of results(); track result.route + result.label) {
      <mat-option [value]="result">
        <mat-icon class="result-icon">{{ result.icon }}</mat-icon>
        <span class="result-label">{{ result.label }}</span>
        <span class="result-group">{{ result.group }}</span>
        <span class="result-sub">{{ result.sublabel }}</span>
      </mat-option>
    }
    @if (results().length === 0 && control.value.length >= 2 && !loading()) {
      <mat-option disabled>No matches found</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
