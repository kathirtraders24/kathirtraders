<div class="header-row">
  <h2>Suppliers</h2>
  <button mat-flat-button color="primary" (click)="addSupplier()">
    <mat-icon>add</mat-icon> Add Supplier
  </button>
</div>

@if (loading$ | async) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<table mat-table [dataSource]="(suppliers$ | async) || []" class="supplier-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let s">{{ s.name }}</td>
  </ng-container>

  <ng-container matColumnDef="gstin">
    <th mat-header-cell *matHeaderCellDef>GSTIN</th>
    <td mat-cell *matCellDef="let s">{{ s.gstin }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let s">{{ s.phone }}</td>
  </ng-container>

  <ng-container matColumnDef="paymentTerms">
    <th mat-header-cell *matHeaderCellDef>Payment Terms</th>
    <td mat-cell *matCellDef="let s">{{ s.paymentTerms }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let s">
      <button mat-icon-button (click)="editSupplier(s)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button color="warn" (click)="deleteSupplier(s)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
