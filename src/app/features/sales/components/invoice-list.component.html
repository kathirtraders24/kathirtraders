<div class="header-row">
  <h2>Sales Invoices</h2>
  <button mat-flat-button color="primary" (click)="createInvoice()">
    <mat-icon>add</mat-icon> New Invoice
  </button>
</div>

@if (loading$ | async) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<table mat-table [dataSource]="(invoices$ | async) || []" class="invoice-table">
  <ng-container matColumnDef="invoiceNumber">
    <th mat-header-cell *matHeaderCellDef>Invoice #</th>
    <td mat-cell *matCellDef="let inv">{{ inv.invoiceNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let inv">{{ inv.date | date:'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let inv">{{ inv.customerName }}</td>
  </ng-container>

  <ng-container matColumnDef="grandTotal">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let inv">{{ inv.grandTotal | paise }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let inv">
      <mat-chip-set>
        <mat-chip [class]="'status-' + inv.status">{{ inv.status }}</mat-chip>
      </mat-chip-set>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let inv">
      <button mat-icon-button (click)="viewInvoice(inv)"><mat-icon>visibility</mat-icon></button>
      @if (inv.status === 'draft') {
        <button mat-icon-button color="primary" (click)="confirmInvoice(inv)"><mat-icon>check_circle</mat-icon></button>
        <button mat-icon-button color="warn" (click)="cancelInvoice(inv)"><mat-icon>cancel</mat-icon></button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
