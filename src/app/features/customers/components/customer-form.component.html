<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit' : 'Add' }} Customer</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>GSTIN (optional)</mat-label>
        <input matInput formControlName="gstin">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>State Code</mat-label>
        <input matInput formControlName="stateCode" placeholder="e.g., 33">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Credit Limit (₹)</mat-label>
        <input matInput type="number" formControlName="creditLimitRupees">
        <span matTextPrefix>₹&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address" rows="3"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-button type="button" (click)="cancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
