<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit' : 'Add' }} Product</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>SKU</mat-label>
        <input matInput formControlName="sku" placeholder="e.g., PLB-001">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Product Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option value="plumbing">Plumbing</mat-option>
          <mat-option value="electrical">Electrical</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Sub-Category</mat-label>
        <input matInput formControlName="subCategory" placeholder="e.g., pipes, switches">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>
        <mat-select formControlName="unit">
          <mat-option value="nos">Nos</mat-option>
          <mat-option value="mtr">Mtr</mat-option>
          <mat-option value="kg">Kg</mat-option>
          <mat-option value="box">Box</mat-option>
          <mat-option value="set">Set</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>HSN Code</mat-label>
        <input matInput formControlName="hsnCode" placeholder="e.g., 7307">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>GST Rate (%)</mat-label>
        <mat-select formControlName="gstRate">
          <mat-option [value]="5">5%</mat-option>
          <mat-option [value]="12">12%</mat-option>
          <mat-option [value]="18">18%</mat-option>
          <mat-option [value]="28">28%</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unit Price (₹)</mat-label>
        <input matInput type="number" formControlName="unitPriceRupees" placeholder="e.g., 150.00">
        <span matTextPrefix>₹&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-button type="button" (click)="cancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
