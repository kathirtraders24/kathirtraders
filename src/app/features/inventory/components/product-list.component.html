<div class="header-row">
  <h2>Products</h2>
  <button mat-flat-button color="primary" (click)="addProduct()">
    <mat-icon>add</mat-icon> Add Product
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search products</mat-label>
  <input matInput [(ngModel)]="searchTerm" placeholder="Name, SKU, or category...">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (loading$ | async) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<table mat-table [dataSource]="(products$ | async) || []" class="product-table">
  <ng-container matColumnDef="sku">
    <th mat-header-cell *matHeaderCellDef>SKU</th>
    <td mat-cell *matCellDef="let p">{{ p.sku }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let p">{{ p.name }}</td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let p">
      <mat-chip-set>
        <mat-chip [class]="p.category">{{ p.category }}</mat-chip>
      </mat-chip-set>
    </td>
  </ng-container>

  <ng-container matColumnDef="hsnCode">
    <th mat-header-cell *matHeaderCellDef>HSN</th>
    <td mat-cell *matCellDef="let p">{{ p.hsnCode }}</td>
  </ng-container>

  <ng-container matColumnDef="gstRate">
    <th mat-header-cell *matHeaderCellDef>GST %</th>
    <td mat-cell *matCellDef="let p">{{ p.gstRate }}%</td>
  </ng-container>

  <ng-container matColumnDef="unitPrice">
    <th mat-header-cell *matHeaderCellDef>Unit Price</th>
    <td mat-cell *matCellDef="let p">{{ p.unitPrice | paise }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let p">
      <button mat-icon-button (click)="editProduct(p)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button color="warn" (click)="deleteProduct(p)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
